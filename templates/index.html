<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader • Ultra Premium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(225, 29, 72, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(147, 51, 234, 0.12) 0%, transparent 40%);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glow-border {
            position: relative;
            border-radius: 1.5rem;
        }
        .glow-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(45deg, #ef4444, #8b5cf6, #3b82f6);
            z-index: -1;
            opacity: 0.3;
            filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .glow-border:hover::before {
            opacity: 0.6;
        }

        .input-box:focus {
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Header Section -->
    <header class="py-10 text-center relative">
        <div class="inline-flex items-center space-x-2 py-1.5 px-4 rounded-full bg-gradient-to-r from-red-500/10 to-purple-500/10 border border-red-500/20 text-red-400 text-xs font-semibold tracking-wider uppercase mb-4 shadow-inner">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span>Fast & Secure • No Watermark</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
            TikTok <span class="bg-gradient-to-r from-red-500 via-rose-500 to-purple-600 bg-clip-text text-transparent">Downloader</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-base mt-3 max-w-md mx-auto px-4 font-light">
            ওয়াটারমার্ক ছাড়াই চোখের পলকে ডাউনলোড করুন আপনার পছন্দের টিকটক ভিডিও।
        </p>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 max-w-lg mb-auto">
        <div class="glow-border">
            <div class="glass-panel p-6 md:p-8 rounded-3xl space-y-6">
                
                <!-- Input Group -->
                <div class="space-y-2">
                    <label for="url" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">ভিডিও লিংক এখানে পেস্ট করুন</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-red-500 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                        </span>
                        <input type="text" id="url" placeholder="https://www.tiktok.com/@username/video/..." 
                            class="input-box w-full pl-12 pr-4 py-4 bg-gray-900/90 border border-gray-800 rounded-2xl focus:outline-none text-white placeholder-gray-600 text-sm transition">
                    </div>
                </div>

                <!-- Action Button -->
                <button onclick="downloadVideo()" id="downloadBtn" 
                    class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-purple-600 hover:from-red-500 hover:to-purple-500 text-white font-semibold py-4 rounded-2xl transition duration-300 shadow-lg shadow-red-600/30 hover:shadow-red-600/50 flex items-center justify-center space-x-2 group">
                    <span>প্রসেস শুরু করুন</span>
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>

                <!-- Loading Animation -->
                <div id="loading" class="hidden text-center py-6 space-y-3">
                    <div class="inline-block relative w-12 h-12">
                        <div class="absolute inset-0 rounded-full border-2 border-red-500/20"></div>
                        <div class="absolute inset-0 rounded-full border-2 border-red-500 border-t-transparent animate-spin"></div>
                    </div>
                    <p class="text-gray-400 text-xs font-medium tracking-wide animate-pulse">ভিডিওর ডেটা ফেচ করা হচ্ছে...</p>
                </div>

                <!-- Result Card -->
                <div id="result" class="hidden mt-4 bg-gray-950/80 p-5 rounded-2xl border border-gray-800/80 space-y-5 backdrop-blur-md">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <img id="authorAvatar" src="" alt="Avatar" class="w-14 h-14 rounded-2xl object-cover border border-red-500/30 shadow-md">
                            <div class="absolute -bottom-1 -right-1 bg-red-600 text-[10px] px-1.5 py-0.5 rounded-full font-bold">HD</div>
                        </div>
                        <div class="overflow-hidden">
                            <h4 id="authorName" class="font-bold text-white text-sm truncate"></h4>
                            <p id="videoTitle" class="text-gray-400 text-xs line-clamp-2 mt-0.5 leading-relaxed"></p>
                        </div>
                    </div>
                    
                    <div class="pt-1">
                        <a id="downloadLink" href="" target="_blank" 
                            class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-center text-white font-medium py-3.5 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/30">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            <span>ডাউনলোড ভিডিও (No Watermark)</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-gray-600 text-xs tracking-wide">
        &copy; 2026 TikTok Downloader • Built with Python & Flask
    </footer>

    <!-- Script Logic -->
    <script>
        async function downloadVideo() {
            const url = document.getElementById('url').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!url) {
                alert('দয়া করে একটি ভ্যালিড টিকটক লিংক দিন।');
                return;
            }

            loading.classList.remove('hidden');
            result.classList.add('hidden');
            downloadBtn.disabled = true;

            try {
                // আপনার নির্দিষ্ট করা ফরম্যাট: /api/download?url={tiktok_vide_url}
                const response = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('authorAvatar').src = data.avatar;
                    document.getElementById('authorName').innerText = data.author;
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('downloadLink').href = data.video;
                    
                    result.classList.remove('hidden');
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                loading.classList.add('hidden');
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
